<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>MK</title>
  <!-- Carbon tile. The mark sits on its own surface so it survives a light
       browser chrome as well as a dark one. -->
  <rect width="64" height="64" rx="15" fill="#0A0A0C" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none"
        stroke="#F4F5F7" stroke-opacity="0.14" stroke-width="1.5" />

  <!-- MK monogram, drawn as paths so it never depends on a webfont. Both
       letters sit on a 16–44 cap height with a full stem-width gap between
       them, so the K still reads as a separate letter at 16px instead of
       merging into the M. -->
  <g fill="#F4F5F7">
    <path d="M6 44V16h5.5L18 29.5 24.5 16H30v28h-5V26l-5 10.5h-4L11 26v18H6Z" />
    <path d="M35 44V16h5.8v12L51 16h7L47 28.6 58.4 44h-7l-8-11.2-2.6 2.8V44H35Z" />
  </g>

  <!-- The site's red tick, reused at icon scale -->
  <rect x="6" y="50" width="18" height="3.5" rx="1.75" fill="#FF1E00" />
</svg>
